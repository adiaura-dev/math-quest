<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quest | Level Up Your Algebra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e1222;
  --panel: #1a2136;
  --panel2: #141a2c;
  --line: #2e3854;
  --text: #e8ecf8;
  --muted: #8f9bbd;
  --amber: #ffb347;
  --violet: #7c5cff;
  --green: #3ddc97;
  --red: #ff5d73;
  --blue: #55cfff;
  --yellow: #ffd84d;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "Nunito", system-ui, sans-serif;
  color: var(--text);
  background: radial-gradient(circle at 15% 0%, #241a4a 0%, transparent 45%), radial-gradient(circle at 90% 100%, #10324a 0%, transparent 45%), var(--bg);
  min-height: 100vh;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, .logo, .fredoka { font-family: "Fredoka", "Nunito", sans-serif; }

/* floating math symbols */
.bg-symbols { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-symbols span { position: absolute; bottom: -60px; color: #ffffff; opacity: .06; font-family: "Fredoka", sans-serif; font-weight: 700; animation: floatUp linear infinite; }
@keyframes floatUp { from { transform: translateY(0) rotate(0); } to { transform: translateY(-120vh) rotate(200deg); } }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; background: rgba(14, 18, 34, .82); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
.logo b { color: var(--amber); }
.logo-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--violet), var(--amber)); color: #fff; font-size: 24px; box-shadow: 0 0 22px #7c5cff66; animation: wobble 3s ease-in-out infinite; }
@keyframes wobble { 50% { transform: rotate(-8deg) scale(1.05); } }
.stats { display: flex; align-items: center; gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; font-weight: 800; color: var(--text); font-size: 14px; }
.chip.level { flex-direction: column; align-items: stretch; gap: 3px; min-width: 150px; padding: 6px 12px; }
.chip.level .row { display: flex; justify-content: space-between; font-size: 12px; }
.chip.level small { color: var(--muted); font-weight: 700; }
.xpbar { height: 7px; background: #0c1020; border-radius: 9px; overflow: hidden; }
.xpbar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--amber), var(--violet)); border-radius: 9px; transition: width .6s cubic-bezier(.2,1,.3,1); }
.chip.bump { animation: bump .45s ease-out; }
@keyframes bump { 40% { transform: scale(1.18); } }
.btn-sound { font-size: 16px; }

main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 26px 22px 60px; }
.screen { display: none; animation: screenIn .45s ease-out; }
.screen.active { display: block; }
@keyframes screenIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* home */
.hero { text-align: center; margin: 10px auto 30px; max-width: 760px; }
.eyebrow { color: var(--amber); font-weight: 900; letter-spacing: 3px; font-size: 13px; margin: 0 0 8px; }
.hero h1 { font-size: clamp(30px, 5vw, 50px); margin: 0 0 10px; line-height: 1.1; }
.grad { background: linear-gradient(90deg, var(--amber), #ff7eb6, var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: var(--muted); font-size: 17px; margin: 0; }
.topics { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
.topic { position: relative; text-align: left; background: linear-gradient(160deg, var(--panel), var(--panel2)); border: 1px solid var(--line); border-radius: 22px; padding: 22px; color: var(--text); overflow: hidden; transition: transform .25s, border-color .25s, box-shadow .25s; }
.topic::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 10%, var(--c) 0%, transparent 55%); opacity: .18; transition: opacity .25s; }
.topic:hover { transform: translateY(-6px) rotate(-.5deg); border-color: var(--c); box-shadow: 0 18px 40px #0007, 0 0 30px color-mix(in srgb, var(--c) 35%, transparent); }
.topic:hover::before { opacity: .32; }
.topic .t-icon { position: relative; font-size: 42px; display: inline-block; margin-bottom: 10px; transition: transform .3s; }
.topic:hover .t-icon { transform: scale(1.2) rotate(-10deg); }
.topic h3 { position: relative; margin: 0 0 6px; font-size: 22px; }
.topic p { position: relative; margin: 0 0 16px; color: var(--muted); font-size: 14.5px; line-height: 1.5; }
.topic .t-foot { position: relative; display: flex; justify-content: space-between; align-items: center; }
.stars { color: #4a5578; font-size: 18px; letter-spacing: 2px; }
.stars .on { color: var(--yellow); text-shadow: 0 0 10px #ffd84d88; }
.t-go { background: var(--c); color: #111; border-radius: 10px; padding: 6px 12px; font-weight: 900; font-size: 13px; }
.tag { position: absolute; top: 14px; right: 14px; background: var(--amber); color: #2a1600; font-weight: 900; font-size: 10.5px; letter-spacing: 1px; padding: 5px 9px; border-radius: 20px; animation: tagPulse 1.6s ease-in-out infinite; z-index: 1; }
@keyframes tagPulse { 50% { box-shadow: 0 0 0 6px #ffb34733; } }
.home-foot { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.mini { background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.mini b { font-size: 22px; font-family: "Fredoka", sans-serif; }
.mini span { color: var(--muted); font-size: 13px; font-weight: 700; }

/* play */
.play-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.back { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 9px 14px; font-weight: 800; }
.back:hover { border-color: var(--amber); }
.play-title { display: flex; align-items: center; gap: 10px; flex: 1; }
.play-title h2 { margin: 0; font-size: 26px; }
.play-title span { font-size: 30px; }
.diff { display: flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.diff button { border: 0; background: transparent; color: var(--muted); font-weight: 800; padding: 7px 13px; border-radius: 9px; }
.diff button.active { background: var(--amber); color: #2a1600; }
.progress { display: flex; gap: 6px; margin-bottom: 16px; }
.progress i { flex: 1; height: 8px; border-radius: 8px; background: #252e47; transition: background .3s; }
.progress i.now { background: var(--blue); box-shadow: 0 0 10px #55cfff88; }
.progress i.good { background: var(--green); }
.progress i.half { background: var(--amber); }
.progress i.bad { background: var(--red); }
.play-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.card { background: linear-gradient(160deg, var(--panel), var(--panel2)); border: 1px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: 0 20px 50px #0005; }
.qcard { position: relative; min-height: 420px; }
.qcard.shake { animation: shake .45s linear; }
@keyframes shake { 15% { transform: translateX(-9px); } 30% { transform: translateX(8px); } 45% { transform: translateX(-6px); } 60% { transform: translateX(5px); } 75% { transform: translateX(-2px); } }
.q-label { color: var(--amber); font-weight: 900; letter-spacing: 2px; font-size: 12px; margin-bottom: 10px; }
.sentence { font-size: clamp(19px, 2.4vw, 24px); line-height: 1.55; margin: 0 0 14px; font-weight: 700; }
.kw { border-radius: 6px; transition: background .3s, color .3s, padding .3s; }
.show-kw .kw { padding: 1px 5px; font-weight: 900; }
.show-kw .kw-mul { background: #ff9f4333; color: #ffb36b; }
.show-kw .kw-add { background: #3ddc9733; color: #6ff0b8; }
.show-kw .kw-sub { background: #ff5d7333; color: #ff8c9c; }
.show-kw .kw-div { background: #7c5cff33; color: #b6a4ff; }
.show-kw .kw-eq { background: #55cfff33; color: #8fe0ff; }
.show-kw .kw-var { background: #ffd84d33; color: #ffe27a; }
.tools { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.tool { background: #232c45; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 7px 12px; font-weight: 800; font-size: 13px; }
.tool:hover { border-color: var(--yellow); }
.tool.used { opacity: .55; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { text-align: left; background: #222b44; border: 2px solid #313c5c; color: var(--text); border-radius: 14px; padding: 14px 16px; font-size: 19px; font-weight: 800; transition: transform .15s, border-color .2s, background .2s; display: flex; align-items: center; gap: 12px; }
.opt .letter { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: #313c5c; font-size: 13px; color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--amber); transform: translateY(-2px); }
.opt:disabled { cursor: default; }
.opt.right { background: #133d32; border-color: var(--green); animation: pop .4s ease-out; }
.opt.right .letter { background: var(--green); color: #062218; }
.opt.wrong { background: #46202a; border-color: var(--red); animation: shake .4s; }
.opt.wrong .letter { background: var(--red); color: #fff; }
.opt.dim { opacity: .45; }
@keyframes pop { 50% { transform: scale(1.05); } }
.eqn { font-family: "Fredoka", sans-serif; font-weight: 600; letter-spacing: .5px; white-space: nowrap; }
.eqn i.v { color: var(--yellow); font-style: italic; font-family: Georgia, serif; font-weight: 700; padding: 0 1px; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .8em; line-height: 1.1; margin: 0 2px; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 3px; }
.feedback { margin-top: 14px; border-radius: 14px; padding: 0 14px; max-height: 0; overflow: hidden; transition: all .35s; font-weight: 700; line-height: 1.5; }
.feedback.show { max-height: 300px; padding: 12px 14px; }
.feedback.good { background: #133d32; border: 1px solid var(--green); color: #b8f5dc; }
.feedback.bad { background: #3d1c25; border: 1px solid var(--red); color: #ffc7cf; }
.feedback.info { background: #1d2a4a; border: 1px solid var(--blue); color: #c7ecff; }
.stage2 { margin-top: 20px; padding-top: 18px; border-top: 2px dashed var(--line); animation: screenIn .5s ease-out; }
.eq-big { font-size: clamp(26px, 4vw, 38px); text-align: center; margin: 4px 0 6px; }
.answer-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.answer-row label { font-family: "Fredoka", sans-serif; font-size: 26px; }
.answer-row label i { color: var(--yellow); font-family: Georgia, serif; }
.ans { width: 110px; font: 800 24px "Fredoka", sans-serif; text-align: center; background: #0f1426; color: #fff; border: 2px solid #34406a; border-radius: 12px; padding: 8px; outline: none; transition: border-color .2s, box-shadow .2s; }
.ans:focus { border-color: var(--amber); box-shadow: 0 0 0 4px #ffb34733; }
.btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 900; font-size: 16px; color: #1d1100; background: linear-gradient(135deg, var(--amber), #ff8a3d); box-shadow: 0 6px 0 #a3561a, 0 10px 20px #0006; transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a3561a; }
.btn.alt { background: linear-gradient(135deg, #8a72ff, var(--violet)); color: #fff; box-shadow: 0 6px 0 #4a33b3, 0 10px 20px #0006; }
.btn.ghost { background: #232c45; color: var(--text); box-shadow: 0 6px 0 #151b2e; }
.next-row { display: flex; justify-content: flex-end; margin-top: 18px; }
.steps { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #10162a; border: 1px solid var(--line); border-left: 4px solid var(--violet); border-radius: 10px; padding: 10px 14px; opacity: 0; transform: translateX(-14px); animation: stepIn .45s ease-out forwards; }
.steps li .eqn { font-size: 21px; }
.steps li small { color: var(--muted); font-weight: 700; font-size: 12.5px; text-align: right; }
.steps li.final { border-left-color: var(--green); background: #10261f; }
@keyframes stepIn { to { opacity: 1; transform: none; } }

/* balance scale */
.scale-wrap { display: flex; flex-direction: column; align-items: center; }
.scale { width: 100%; max-width: 440px; height: auto; overflow: visible; }
.scale .pan-text { font-family: "Fredoka", sans-serif; font-weight: 600; fill: #fff; text-anchor: middle; }
.scale .pan-text tspan.v { fill: var(--yellow); font-style: italic; font-family: Georgia, serif; font-weight: 700; }
.scale.balanced .beam { fill: var(--green); filter: drop-shadow(0 0 8px #3ddc97); }
.readout { min-height: 24px; margin-top: 2px; text-align: center; color: var(--muted); font-weight: 800; font-size: 14px; }
.readout b { color: var(--text); }

/* quadratic graph */
.graph { width: 100%; max-width: 460px; display: block; margin: 16px auto 0; background: #0f1426; border: 1px solid var(--line); border-radius: 16px; }
.graph .curve { fill: none; stroke: var(--violet); stroke-width: 3.5; stroke-linecap: round; filter: drop-shadow(0 0 6px #7c5cff); }
.graph .root { fill: var(--yellow); animation: rootPulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes rootPulse { 50% { transform: scale(1.5); } }
.graph text { fill: #c3cbe6; font: 700 12px "Nunito", sans-serif; }

/* side panel */
.side h3 { margin: 0 0 12px; font-size: 19px; }
.side p { color: #c3cbe6; line-height: 1.55; font-size: 14px; margin: 0 0 12px; }
.dict { display: grid; gap: 6px; margin-bottom: 14px; }
.dict div { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #10162a; border-radius: 10px; padding: 8px 11px; font-size: 13px; font-weight: 700; color: #c3cbe6; }
.dict b { font-family: "Fredoka", sans-serif; font-size: 18px; min-width: 30px; text-align: center; border-radius: 8px; padding: 1px 6px; }
.dict .m b { background: #ff9f4333; color: #ffb36b; }
.dict .a b { background: #3ddc9733; color: #6ff0b8; }
.dict .s b { background: #ff5d7333; color: #ff8c9c; }
.dict .d b { background: #7c5cff33; color: #b6a4ff; }
.dict .e b { background: #55cfff33; color: #8fe0ff; }
.dict .x b { background: #ffd84d33; color: #ffe27a; font-family: Georgia, serif; font-style: italic; }
.tip { background: #10162a; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13.5px; color: #c3cbe6; line-height: 1.55; margin-bottom: 10px; }
.tip b { color: var(--amber); }
.score-line { display: flex; justify-content: space-between; font-weight: 800; color: var(--muted); font-size: 13px; margin-top: 8px; }
.score-line b { color: var(--text); }

/* results */
.results { text-align: center; padding: 20px 0; }
.results h2 { font-size: 36px; margin: 6px 0; }
.big-stars { font-size: 64px; letter-spacing: 8px; margin: 8px 0; }
.big-stars span { display: inline-block; color: #3a4466; opacity: 0; animation: starIn .5s cubic-bezier(.2,1.6,.4,1) forwards; }
.big-stars span.on { color: var(--yellow); text-shadow: 0 0 22px #ffd84d; }
@keyframes starIn { from { opacity: 0; transform: scale(0) rotate(-90deg); } to { opacity: 1; transform: none; } }
.res-grid { display: flex; justify-content: center; gap: 12px; margin: 18px 0; flex-wrap: wrap; }
.res-grid div { background: #10162a; border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; min-width: 120px; }
.res-grid b { display: block; font-size: 28px; font-family: "Fredoka", sans-serif; }
.res-grid span { color: var(--muted); font-weight: 800; font-size: 12px; letter-spacing: 1px; }
.res-btns { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 10px; }

/* boss */
.arena { position: relative; text-align: center; padding: 10px 0 6px; margin: -6px 0 12px; border-radius: 16px; background: radial-gradient(ellipse at 50% 70%, #ff9f4322, transparent 65%); }
.arena.ouch { animation: ouch .7s ease-out; }
@keyframes ouch { 30% { background-color: #ff5d7333; } }
.sprite { display: inline-block; width: 130px; filter: drop-shadow(0 0 16px #ff9f4388); animation: bob 1.1s steps(2) infinite; }
.sprite svg { display: block; width: 100%; height: auto; }
.sprite.hit { animation: hit .6s ease-out; }
.sprite.laugh { animation: laugh 1.2s ease-in-out; }
.sprite.dead { animation: dead 1.1s ease-in forwards; }
.sprite.angry { filter: drop-shadow(0 0 22px #ff5d73) saturate(1.5) hue-rotate(-25deg); }
@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes hit { 0% { transform: none; filter: brightness(1); } 10% { transform: translateX(20px) rotate(10deg) scale(1.15, .85); filter: brightness(5) saturate(0); } 25% { transform: translateX(-12px) rotate(-6deg); filter: brightness(1); } 40% { transform: translateX(8px) rotate(4deg); filter: brightness(4) saturate(0); } 60% { transform: translateX(-4px); filter: brightness(1); } 100% { transform: none; } }
@keyframes laugh { 10% { transform: translateY(4px) scale(1.15, .85); } 22% { transform: translateY(-24px) scale(.9, 1.1) rotate(-8deg); } 34% { transform: translateY(2px) scale(1.1, .9); } 46% { transform: translateY(-18px) rotate(8deg); } 58% { transform: translateY(2px); } 70% { transform: translateY(-10px) rotate(-5deg); } 85% { transform: none; } }
@keyframes dead { to { transform: rotate(540deg) scale(0); opacity: 0; } }
.hp { display: flex; align-items: center; gap: 10px; margin: 8px auto 0; max-width: 360px; font-weight: 900; font-size: 13px; }
.hp-bar { flex: 1; height: 14px; background: #0c1020; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.hp-bar div { height: 100%; width: 100%; background: linear-gradient(90deg, var(--red), var(--amber)); transition: width .5s; }
.lives { font-size: 20px; letter-spacing: 2px; }
.lives.lost { display: inline-block; animation: bump .5s; }

/* floating text, toast, confetti */
.pop-text { position: fixed; z-index: 60; transform: translate(-50%, -50%); font: 700 24px "Fredoka", sans-serif; text-shadow: 3px 3px 0 #0b0f1c; pointer-events: none; white-space: nowrap; animation: floatText 1.2s ease-out forwards; }
.pop-text.big { font-size: 40px; }
@keyframes floatText { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -60%) scale(1.25); } 35% { transform: translate(-50%, -70%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -200%); } }
.toast { position: fixed; left: 50%; top: 80px; z-index: 70; opacity: 0; transform: translate(-50%, -140px); background: var(--panel); border: 1px solid var(--amber); color: #fff; font-weight: 900; padding: 12px 20px; border-radius: 14px; box-shadow: 0 0 30px #ffb34755; transition: transform .4s cubic-bezier(.2,1.4,.4,1), opacity .3s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 65; }

@media (max-width: 900px) {
  .play-grid { grid-template-columns: 1fr; }
  .chip.level { min-width: 110px; }
}
@media (max-width: 560px) {
  .topbar { padding: 10px 12px; }
  .logo { font-size: 18px; }
  .logo-icon { width: 34px; height: 34px; font-size: 20px; }
  .chip { padding: 6px 9px; font-size: 13px; }
  .chip.level { min-width: 84px; }
  .chip.level small { display: none; }
  main { padding: 18px 12px 50px; }
  .options { grid-template-columns: 1fr; }
  .card { padding: 16px; }
  .play-title h2 { font-size: 21px; }
  .opt { font-size: 17px; }
}
</style>
</head>
<body>
<div class="bg-symbols" id="bg"></div>

<header class="topbar">
  <div class="logo" id="go-home" title="Home"><span class="logo-icon">∑</span><span>MATH<b>QUEST</b></span></div>
  <div class="stats">
    <div class="chip level" id="lvl-chip">
      <div class="row"><span>LEVEL <b id="lvl">1</b></span><small id="xptext">0 / 100</small></div>
      <div class="xpbar"><div id="xpfill"></div></div>
    </div>
    <div class="chip" id="streak-chip" title="Correct answers in a row">🔥 <b id="streak">0</b></div>
    <button class="chip btn-sound" id="sound" title="Sound on/off">🔊</button>
  </div>
</header>

<main>
  <section id="home" class="screen active">
    <div class="hero">
      <p class="eyebrow">CHOOSE YOUR QUEST</p>
      <h1>What will you <span class="grad">master</span> today?</h1>
      <p class="sub">Pick a topic, choose your level and start earning XP. Every right answer makes you stronger! 💪</p>
    </div>
    <div class="topics" id="topics"></div>
    <div class="home-foot">
      <div class="mini"><span style="font-size:28px">⭐</span><div><b id="h-xp">0</b><br><span>TOTAL XP</span></div></div>

<script>
"use strict";

/* =====================================================
   MATH QUEST
   One-file website: topics, XP, streaks, balance scale,
   graphs and a boss battle. Progress is saved in the browser.
   ===================================================== */

const $ = sel => document.querySelector(sel);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const r = [...arr]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const N = n => (n < 0 ? `−${-n}` : `${n}`);              // number with a proper minus sign
const plusTerm = n => (n < 0 ? `− ${-n}` : `+ ${n}`);     // "+ 5" or "− 5"

/* ---------- saved progress ---------- */
const SAVE_KEY = "mathQuestSave";
let save = { xp: 0, bestStreak: 0, solved: 0, stars: {}, levels: {}, sound: true };
try { save = Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (_) { /* first visit */ }
function store() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) { /* ignore */ } }
let streak = 0;

/* ---------- sound effects (made with code, no files) ---------- */
let audio = null;
function tone(freq, dur, type = "sine", vol = 0.07, when = 0) {
  if (!save.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime + when;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (_) { /* sound not available */ }
}
const sfx = {
  good() { tone(660, .12, "triangle"); tone(990, .18, "triangle", .07, .1); },
  bad() { tone(200, .18, "sawtooth", .04); tone(140, .3, "sawtooth", .04, .12); },
  click() { tone(520, .05, "sine", .03); },
  level() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, "triangle", .07, i * .1)); },
  hit() { tone(140, .12, "square", .05); tone(90, .25, "sine", .09, .04); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, "triangle", .07, i * .12)); }
};

/* ---------- effects: floating text, toast, confetti ---------- */
function popText(text, color, el, big) {
  const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  const p = document.createElement("div");
  p.className = "pop-text" + (big ? " big" : "");
  p.textContent = text;
  p.style.color = color;
  p.style.left = `${r.left + r.width / 2}px`;
  p.style.top = `${r.top + r.height / 2}px`;
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 1250);
}
let toastTimer;
function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2300);
}
function replay(el, cls, ms) {
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}
const confettiCanvas = $("#confetti");
const cctx = confettiCanvas.getContext("2d");
let confetti = [];
function burst(n = 80, x, y) {
  const cx = x ?? innerWidth / 2, cy = y ?? innerHeight / 3;
  const colors = ["#ffb347", "#7c5cff", "#3ddc97", "#ff5d73", "#55cfff", "#ffd84d"];
  for (let i = 0; i < n; i++) confetti.push({ x: cx, y: cy, vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4, s: 5 + Math.random() * 6, c: colors[i % colors.length], r: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 1 });
  if (confetti.length === n) requestAnimationFrame(drawConfetti);
}
function drawConfetti() {
  confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight;
  cctx.clearRect(0, 0, innerWidth, innerHeight);
  confetti = confetti.filter(c => (c.life -= .008) > 0 && c.y < innerHeight + 30);
  confetti.forEach(c => {
    c.vy += .3; c.x += c.vx; c.y += c.vy; c.r += c.vr; c.vx *= .99;
    cctx.save(); cctx.translate(c.x, c.y); cctx.rotate(c.r);
    cctx.globalAlpha = Math.min(1, c.life * 2); cctx.fillStyle = c.c;
    cctx.fillRect(-c.s / 2, -c.s / 2, c.s, c.s * .6); cctx.restore();
  });
  if (confetti.length) requestAnimationFrame(drawConfetti);
  else cctx.clearRect(0, 0, innerWidth, innerHeight);
}

/* ---------- XP, levels and streaks ---------- */
const XP_PER_LEVEL = 100;
function refreshStats() {
  const lvl = Math.floor(save.xp / XP_PER_LEVEL) + 1;
  $("#lvl").textContent = lvl;
  $("#xptext").textContent = `${save.xp % XP_PER_LEVEL} / ${XP_PER_LEVEL} XP`;
  $("#xpfill").style.width = `${(save.xp % XP_PER_LEVEL) / XP_PER_LEVEL * 100}%`;
  $("#streak").textContent = streak;
  $("#sound").textContent = save.sound ? "🔊" : "🔇";
  $("#h-xp").textContent = save.xp;
  $("#h-best").textContent = save.bestStreak;
  $("#h-solved").textContent = save.solved;
}
function gainXP(amount, el) {
  const before = Math.floor(save.xp / XP_PER_LEVEL);
  save.xp += amount;
  R.xp += amount;
  popText(`+${amount} XP`, "#ffd84d", el);
  replay($("#lvl-chip"), "bump", 450);
  if (Math.floor(save.xp / XP_PER_LEVEL) > before) {
    setTimeout(() => { sfx.level(); burst(140); toast(`⭐ LEVEL UP! You are now level ${Math.floor(save.xp / XP_PER_LEVEL) + 1}!`); }, 400);
  }

}
function markRight(el, base = 10) {
  streak++;
  save.solved++;
  if (streak > save.bestStreak) save.bestStreak = streak;
  const bonus = Math.min(10, Math.max(0, streak - 1) * 2);
  sfx.good();
  gainXP(base + bonus, el);
  replay($("#streak-chip"), "bump", 450);
  if (streak >= 3 && streak % 1 === 0 && [3, 5, 7, 10, 15, 20].includes(streak)) {
    setTimeout(() => popText(`🔥 ${streak} IN A ROW!`, "#ff9f43", $("#streak-chip"), true), 250);

}
function markWrong() {
  streak = 0;
  sfx.bad();
  replay($("#qcard"), "shake", 450);

}

/* ---------- equation display + checker ---------- */
// Turns "3x + 5 = 20" into pretty HTML with a coloured x and stacked fractions
function fmt(eq) {
  let h = eq
    .replace(/\(([^()]+)\)\/(\d+)/g, (m, a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`)
    .replace(/(\d*x)\/(\d+)/g, (m, a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`);
  h = h.replace(/x/g, '<i class="v">x</i>');
  return `<span class="eqn">${h}</span>`;
}
// Works out one side of an equation for a given x (used by the balance scale)
function evalSide(side, x) {
  let e = side.replace(/−/g, "-").replace(/×/g, "*").replace(/÷/g, "/").replace(/²/g, "**2");
  e = e.replace(/(\d)\s*x/g, "$1*x").replace(/(\d|x|\))\s*\(/g, "$1*(").replace(/x/g, `(${x})`);
  return Function(`"use strict"; return (${e});`)();
}
const sides = eq => eq.split(" = ");

/* =====================================================
   QUESTION MAKERS
   Every question is made fresh with random numbers.
   ===================================================== */

const tw = (a, cap) => a === 2 ? (cap ? "Twice" : "twice") : a === 3 ? (cap ? "Three times" : "three times") : `${a} times`;

// Sentence templates. {mul|...} etc. mark the keywords that the 💡 button highlights.
const SENTENCES = {
  1: [
    function sum() {
      const b = rnd(2, 20), x = rnd(2, 30), c = x + b;
      return {
        sentence: pick([`{add|The sum of} {var|a number} and ${b} {eq|is} ${c}.`, `{var|A number} {add|increased by} ${b} {eq|equals} ${c}.`, `{add|Adding} ${b} to {var|a number} {eq|gives} ${c}.`]),

        steps: [[`x − ${b} = ${c}`, "Start"], [`x = ${c} + ${b}`, `Add ${b} to both sides`], [`x = ${x}`, "Done!"]]

    function timesPlus() {

        sentence: pick([`{mul|${tw(a, true)}} {var|a number} {add|increased by} ${b} {eq|is} ${c}.`, `{add|${b} more than} {mul|${tw(a, false)}} {var|a number} {eq|is} ${c}.`, `If you {mul|multiply} {var|a number} {mul|by ${a}} and {add|add} ${b}, you {eq|get} ${c}.`]),
        eq: `${a}x + ${b} = ${c}`, x,
        wrong: [[`${a}(x + ${b}) = ${c}`, `This multiplies the whole (number + ${b}) by ${a}. In the sentence, only the number is multiplied, and then ${b} is added.`], [`${b}x + ${a} = ${c}`, `The numbers are swapped! The number is multiplied by ${a}, and ${b} is added.`], [`${a}x − ${b} = ${c}`, `"Increased by", "more than" and "add" all mean +, not −.`]],
        steps: [[`${a}x + ${b} = ${c}`, "Start"], [`${a}x = ${c} − ${b}`, `Subtract ${b} from both sides`], [`${a}x = ${c - b}`, "Work it out"], [`x = ${c - b} ÷ ${a}`, `Divide both sides by ${a}`], [`x = ${x}`, "Done!"]]
      };
    },
    function fraction() {
      const a = pick([2, 3, 4, 5]); let k = rnd(2, 12); if (k === a) k++;
      const x = a * k;
      return {
        sentence: pick([`{div|${FRAC_WORD[a]} of} {var|a number} {eq|is} ${k}.`, `{var|A number} {div|divided by ${a}} {eq|gives} ${k}.`]),
        eq: `x/${a} = ${k}`, x,
        wrong: [[`${a}x = ${k}`, `Taking ${FRAC_WORD[a].toLowerCase()} of a number, or dividing by ${a}, means x/${a}. Not multiplying!`], [`x/${k} = ${a}`, `The number is divided by ${a}, and the answer is ${k}: x/${a} = ${k}.`], [`x − ${a} = ${k}`, `A fraction of a number means dividing, not subtracting.`]],
        steps: [[`x/${a} = ${k}`, "Start"], [`x = ${k} × ${a}`, `Multiply both sides by ${a}`], [`x = ${x}`, "Done!"]]

  2: [
    function timesMinus() {
      const a = rnd(2, 6), x = rnd(3, 15); let b = rnd(1, Math.min(20, a * x - 1)); if (b === a) b = b + 1 < a * x ? b + 1 : b - 1;
      const c = a * x - b;
      return {

        eq: `${a}x − ${b} = ${c}`, x,
        wrong: [[`${b} − ${a}x = ${c}`, `Order matters! ${b} is taken away FROM ${a}x, so ${a}x comes first.`], [`${a}(x − ${b}) = ${c}`, `Only the number is multiplied by ${a}, and then ${b} is subtracted.`], [`${a}x + ${b} = ${c}`, `"Subtracted" and "less than" mean −, not +.`]],
        steps: [[`${a}x − ${b} = ${c}`, "Start"], [`${a}x = ${c} + ${b}`, `Add ${b} to both sides`], [`${a}x = ${c + b}`, "Work it out"], [`x = ${c + b} ÷ ${a}`, `Divide both sides by ${a}`], [`x = ${x}`, "Done!"]]
      };
    },
    function price() {
      const [item, items] = pick([["pen", "pens"], ["pencil box", "pencil boxes"], ["chocolate", "chocolates"], ["notebook", "notebooks"], ["toy car", "toy cars"]]);
      const other = pick(["geometry box", "water bottle", "school bag", "story book"]);

      return {
        sentence: `One ${item} costs {var|₹x}. {mul|${a} ${items}} {add|and} a ${other} costing ₹${b} {add|together} {eq|cost} ₹${c}.`,

      };
    },
    function age() {
      const p = person(), sib = pick(["brother", "sister"]);
      const a = rnd(2, 4), x = rnd(3, 12); let b = rnd(1, 10); if (b === a) b++;
      const c = a * x + b;
      return {
        sentence: `${p.name}'s age is {add|${b} year${b === 1 ? "" : "s"} more than} {mul|${tw(a, false)}} the age of ${p.his} younger ${sib}. ${p.name} {eq|is} ${c} years old. Let the ${sib}'s age be {var|x} years.`,
        eq: `${a}x + ${b} = ${c}`, x,
        wrong: [[`${a}(x + ${b}) = ${c}`, `Only the ${sib}'s age is multiplied by ${a}. Then ${b} years are added.`], [`${b}x + ${a} = ${c}`, `The numbers are swapped: it's ${a} times the age, plus ${b}.`], [`${a}x − ${b} = ${c}`, `"More than" means +.`]],
        steps: [[`${a}x + ${b} = ${c}`, "Start"], [`${a}x = ${c} − ${b}`, `Subtract ${b} from both sides`], [`${a}x = ${c - b}`, "Work it out"], [`x = ${c - b} ÷ ${a}`, `Divide both sides by ${a}`], [`x = ${x}`, `The ${sib} is ${x} years old`]]
      };
    },
    function marbles() {
      const p1 = pick(BOYS), p2 = pick(GIRLS), k = rnd(2, 5), x = rnd(4, 20), t = x + k * x;
      return {
        sentence: `${p1} has {var|x} marbles. ${p2} has {mul|${k} times as many} marbles as ${p1}. {add|Together} they {eq|have} ${t} marbles.`,
        eq: `x + ${k}x = ${t}`, x,
        wrong: [[`${k}x = ${t}`, `That's only ${p2}'s marbles! "Together" means you add ${p1}'s x too.`], [`x + ${k} = ${t}`, `${p2} has ${k} TIMES as many, which is ${k}x, not ${k}.`], [`x × ${k}x = ${t}`, `"Together" means add (+), not multiply.`]],

    },

  ],
  3: [
    function bothSides() {
      let a, c2, x, b, d;
      do { a = rnd(2, 4); c2 = a + rnd(1, 3); x = rnd(2, 10); b = rnd(1, 10); d = c2 * x - a * x - b; } while (d < 1);
      return {
        sentence: `${b} {add|more than} {mul|${tw(a, false)}} {var|a number} {eq|is equal to} ${d} {sub|less than} {mul|${tw(c2, false)}} {var|the number}.`,

        steps: [[`${a}x + ${b} = ${c2}x − ${d}`, "Start"], [`${b} + ${d} = ${c2}x − ${a}x`, "Move x terms to one side, numbers to the other"], [`${b + d} = ${c2 - a}x`, "Work it out"], [`x = ${b + d} ÷ ${c2 - a}`, `Divide both sides by ${c2 - a}`], [`x = ${x}`, "Done!"]]
      };
    },
    function rectangle() {
      const x = rnd(3, 15), b = rnd(2, 10), P = 2 * (2 * x + b);

        sentence: `The length of a rectangle is {add|${b} cm more than} its breadth. Its {eq|perimeter is} ${P} cm. Let the breadth be {var|x} cm.`,

        wrong: [[`x + x + ${b} = ${P}`, `Perimeter goes around ALL four sides: 2 × (length + breadth).`], [`x(x + ${b}) = ${P}`, `Length × breadth gives the AREA, not the perimeter.`], [`2x + ${b} = ${P}`, `Perimeter = 2 × (length + breadth) = 2(x + x + ${b}).`]],

      };
    },
    function consecutiveEven() {
      const x = 2 * rnd(2, 20), s = 3 * x + 6;
      return {
        sentence: `{add|The sum of} three consecutive even numbers {eq|is} ${s}. Let the smallest one be {var|x}.`,
        eq: `x + (x + 2) + (x + 4) = ${s}`, x,
        wrong: [[`x + (x + 1) + (x + 2) = ${s}`, `Even numbers are 2 apart (like 4, 6, 8), so add 2 each time, not 1.`], [`x + 2x + 4x = ${s}`, `Each even number is 2 MORE than the last one, not 2 TIMES.`], [`3x = ${s}`, `Close! But you forgot the +2 and +4: it's 3x + 6.`]],
        steps: [[`x + (x + 2) + (x + 4) = ${s}`, "Start"], [`3x + 6 = ${s}`, "Collect like terms"], [`3x = ${s - 6}`, "Subtract 6 from both sides"], [`x = ${x}`, `The numbers are ${x}, ${x + 2}, ${x + 4}`]]
      };
    },
    function moneyLeft() {
      const p = person(), x = rnd(5, 40), a = rnd(2, 6), r = rnd(5, 60), t = a * x + r;
      return {
        sentence: `${p.name} has ₹${t}. ${p.He} {sub|buys} {mul|${a} notebooks} at {var|₹x} each and {eq|has} ₹${r} {sub|left}.`,
        eq: `${t} − ${a}x = ${r}`, x,
        wrong: [[`${a}x − ${t} = ${r}`, `${p.name} starts with ₹${t} and then spends ${a}x, so it's ${t} − ${a}x.`], [`${t} + ${a}x = ${r}`, `Buying things means money goes away, so subtract.`], [`${t} − x = ${r}`, `${p.He} buys ${a} notebooks, so ${p.he} spends ${a} × x = ${a}x.`]],
        steps: [[`${t} − ${a}x = ${r}`, "Start"], [`${t} − ${r} = ${a}x`, `Add ${a}x and subtract ${r} on both sides`], [`${t - r} = ${a}x`, "Work it out"], [`x = ${t - r} ÷ ${a}`, `Divide both sides by ${a}`], [`x = ${x}`, `Each notebook costs ₹${x}`]]
      };
    }
  ]
};

function makeSentence(level) {
  const q = pick(SENTENCES[level])();
  q.kind = "sentence";
  q.options = shuffle([[q.eq, null], ...q.wrong]);
  return q;
}

// Plain equations to solve
function makeSolve(level) {
  const types = {
    1: ["add", "sub", "mul"],
    2: ["mulAdd", "mulSub", "divAdd"],
    3: ["bracket", "both", "negative"]
  }[level];
  const t = pick(types);
  let x, eq, steps;
  if (t === "add") { const b = rnd(2, 20); x = rnd(1, 25); const c = x + b; eq = `x + ${b} = ${c}`; steps = [[eq, "Start"], [`x = ${c} − ${b}`, `Subtract ${b} from both sides`], [`x = ${x}`, "Done!"]]; }
  if (t === "sub") { const b = rnd(2, 20); x = rnd(b + 1, b + 20); const c = x - b; eq = `x − ${b} = ${c}`; steps = [[eq, "Start"], [`x = ${c} + ${b}`, `Add ${b} to both sides`], [`x = ${x}`, "Done!"]]; }
  if (t === "mul") { const a = rnd(2, 9); x = rnd(2, 12); const c = a * x; eq = `${a}x = ${c}`; steps = [[eq, "Start"], [`x = ${c} ÷ ${a}`, `Divide both sides by ${a}`], [`x = ${x}`, "Done!"]]; }
  if (t === "mulAdd") { const a = rnd(2, 9), b = rnd(1, 20); x = rnd(1, 12); const c = a * x + b; eq = `${a}x + ${b} = ${c}`; steps = [[eq, "Start"], [`${a}x = ${c - b}`, `Subtract ${b} from both sides`], [`x = ${c - b} ÷ ${a}`, `Divide both sides by ${a}`], [`x = ${x}`, "Done!"]]; }
  if (t === "mulSub") { const a = rnd(2, 9); x = rnd(2, 12); const b = rnd(1, a * x - 1); const c = a * x - b; eq = `${a}x − ${b} = ${c}`; steps = [[eq, "Start"], [`${a}x = ${c + b}`, `Add ${b} to both sides`], [`x = ${c + b} ÷ ${a}`, `Divide both sides by ${a}`], [`x = ${x}`, "Done!"]]; }
  if (t === "divAdd") { const a = rnd(2, 6), k = rnd(1, 10), b = rnd(1, 15); x = a * k; const c = k + b; eq = `x/${a} + ${b} = ${c}`; steps = [[eq, "Start"], [`x/${a} = ${k}`, `Subtract ${b} from both sides`], [`x = ${k} × ${a}`, `Multiply both sides by ${a}`], [`x = ${x}`, "Done!"]]; }
  if (t === "bracket") { const a = rnd(2, 6), b = rnd(1, 9); x = rnd(-6, 12) || 3; const c = a * (x + b); eq = `${a}(x + ${b}) = ${N(c)}`; steps = [[eq, "Start"], [`x + ${b} = ${N(c / a)}`, `Divide both sides by ${a}`], [`x = ${N(c / a)} − ${b}`, `Subtract ${b} from both sides`], [`x = ${N(x)}`, "Done!"]]; }
  if (t === "both") {
    let a, c2, b, d;
    do { a = rnd(2, 8); c2 = rnd(1, 7); x = rnd(-8, 10) || 4; b = rnd(-12, 12); d = a * x + b - c2 * x; } while (a === c2 || b === 0 || d === 0);
    const C = c2 === 1 ? "x" : `${c2}x`;
    eq = `${a}x ${plusTerm(b)} = ${C} ${plusTerm(d)}`;
    const k = a - c2, kx = k === 1 ? "x" : k === -1 ? "−x" : `${N(k)}x`;
    steps = [[eq, "Start"], [`${a}x − ${C} = ${N(d)} ${plusTerm(-b)}`, "x terms to the left, numbers to the right"], [`${kx} = ${N(d - b)}`, "Work it out"], [`x = ${N(x)}`, k === 1 ? "Done!" : `Divide both sides by ${N(k)}`]];
  }
  if (t === "negative") { const a = rnd(2, 9), b = rnd(1, 20); x = -rnd(1, 9); const c = a * x - b; eq = `${a}x − ${b} = ${N(c)}`; steps = [[eq, "Start"], [`${a}x = ${N(c + b)}`, `Add ${b} to both sides`], [`x = ${N(c + b)} ÷ ${a}`, `Divide both sides by ${a}`], [`x = ${N(x)}`, "A negative answer!"]]; }
  return { kind: "solve", eq, x, steps };
}

// Quadratic equations with whole-number roots
function makeQuad(level) {
  let r1, r2, a = 1;
  const range = level === 1 ? [1, 9] : [-9, 9];
  do { r1 = rnd(...range); r2 = rnd(...range); } while (r1 === r2 || r1 === 0 || r2 === 0);
  if (level === 3) { a = pick([2, 3]); do { r1 = rnd(-6, 6); r2 = rnd(-6, 6); } while (r1 === r2 || r1 === 0 || r2 === 0); }
  const b = -a * (r1 + r2), c = a * r1 * r2;
  const term = (k, v) => k === 0 ? "" : ` ${k < 0 ? "−" : "+"} ${Math.abs(k) === 1 && v ? "" : Math.abs(k)}${v}`;
  const lead = a === 1 ? "x²" : `${a}x²`;
  const eq = `${lead}${term(b, "x")}${term(c, "")} = 0`;
  const monic = `x²${term(-(r1 + r2), "x")}${term(r1 * r2, "")} = 0`;
  const factor = r => r < 0 ? `(x + ${-r})` : `(x − ${r})`;
  const steps = [[eq, "Start"]];
  if (a !== 1) steps.push([monic, `Divide every term by ${a}`]);
  steps.push([`${N(-r1)} × ${N(-r2)} = ${N(r1 * r2)}, ${N(-r1)} + ${N(-r2)} = ${N(-(r1 + r2))}`, "Find two numbers: × gives the number, + gives the x coefficient"]);
  steps.push([`${factor(r1)}${factor(r2)} = 0`, "Factorise"]);
  steps.push([`x = ${N(r1)} or x = ${N(r2)}`, "Each bracket can be 0"]);
  return { kind: "quad", eq, a, r1, r2, steps };
}

let R = {};   // the current round

function startTopic(id, level) {
  const t = TOPICS.find(x => x.id === id);
  const lvl = level || save.levels[id] || (id === "boss" ? 2 : 1);
  save.levels[id] = lvl; store();
  R = { topic: id, level: lvl, i: 0, total: id === "boss" ? 10 : ROUND, results: [], right: 0, parts: 0, xp: 0, hp: 100, lives: 3 };
  if (id === "boss") R.queue = shuffle([...Array(4)].map(() => "sentence").concat(["solve", "solve", "solve", "quad", "quad", "quad"]));
  $("#play-icon").textContent = t.icon;

}

function renderProgress() {
  $("#progress").innerHTML = [...Array(R.total)].map((_, i) => `<i class="${R.results[i] || (i === R.i ? "now" : "")}"></i>`).join("");
}

function nextQuestion() {
  if (R.topic === "boss" && (R.hp <= 0 || R.lives <= 0)) return showResults();
  if (R.i >= R.total) return showResults();
  const kind = R.topic === "boss" ? R.queue[R.i] : R.topic;
  const lvl = R.topic === "boss" ? (kind === "quad" ? 1 : 2) : R.level;
  R.q = kind === "sentence" ? makeSentence(lvl) : kind === "solve" ? makeSolve(lvl) : makeQuad(lvl);
  R.tries = 0;
  R.partResults = [];
  renderProgress();
  renderQuestion();
}

function finishQuestion(result) {
  R.results[R.i] = result;
  if (result === "good") R.right++;
  R.i++;
  renderProgress();
  const card = $("#qcard");
  const row = document.createElement("div");
  row.className = "next-row";
  const last = R.i >= R.total || (R.topic === "boss" && (R.hp <= 0 || R.lives <= 0));
  row.innerHTML = `<button class="btn" id="next">${last ? "See results 🏁" : "Next question →"}</button>`;
  card.appendChild(row);
  const btn = $("#next");
  btn.addEventListener("click", () => { sfx.click(); nextQuestion(); });

}

/* ---------- drawing a question ---------- */
function renderQuestion() {
  const q = R.q, card = $("#qcard");

    card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => chooseOption(Number(b.dataset.i), b)));
  } else if (q.kind === "solve") {
    renderSolveStage(q.eq, q.x, q.steps);

    setupQuadInputs();
  }
}

function chooseOption(i, btn) {
  const q = R.q, opts = document.querySelectorAll(".opt");
  opts.forEach(b => b.disabled = true);
  const correctIndex = q.options.findIndex(o => o[1] === null);
  const fb = $("#fb1");
  $("#sentence").classList.add("show-kw");
  if (i === correctIndex) {
    btn.classList.add("right");
    opts.forEach((b, k) => { if (k !== i) b.classList.add("dim"); });
    markRight(btn, R.usedHint ? 6 : 10);
    fb.className = "feedback show good";
    fb.innerHTML = `✓ Correct! ${R.usedHint ? "" : "You didn't even need the hint! 😎 "}See how each coloured keyword turned into a symbol.`;
    R.partResults.push(true);
    if (R.topic === "boss") bossHit();
  } else {
    btn.classList.add("wrong");
    opts[correctIndex].classList.add("right");
    markWrong();
    fb.className = "feedback show bad";
    fb.innerHTML = `✗ Not quite. ${q.options[i][1]}<br>The right equation is ${fmt(q.eq)}.`;
    R.partResults.push(false);
    if (R.topic === "boss") bossMiss();
  }
  if (R.topic === "boss") { finishQuestion(R.partResults[0] ? "good" : "bad"); return; }
  setTimeout(() => {
    $("#stage2").innerHTML = `<div class="stage2"><div class="q-label">STEP 2 · NOW SOLVE IT!</div><div id="solve-area"></div></div>`;
    renderSolveStage(q.eq, q.x, q.steps, $("#solve-area"));
    $("#stage2").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, 700);
}

/* ---------- solving with the balance scale ---------- */
function renderSolveStage(eq, x, steps, into) {
  const box = into || $("#stage2");
  const [L, Rt] = sides(eq);
  box.innerHTML = `
    <div class="eq-big">${fmt(eq)}</div>
    <div class="scale-wrap">${scaleSVG(L, Rt)}<div class="readout" id="readout">The scale is waiting… what is <b>x</b>?</div></div>
    <div class="answer-row"><label><i>x</i> =</label><input class="ans" id="ans" inputmode="numeric" autocomplete="off" placeholder="?"><button class="btn" id="check">Check ⚡</button></div>
    <div class="feedback" id="fb2"></div>
    <ol class="steps" id="steps"></ol>`;
  startScale();
  const input = $("#ans");
  const check = () => {
    const v = parseNum(input.value);
    if (v === null) { input.focus(); toast("Type a number first! 🙂"); return; }
    R.tries++;
    const lv = evalSide(L, v), rv = evalSide(Rt, v);
    const fb = $("#fb2");
    $("#readout").innerHTML = `With <b>x = ${N(v)}</b>: left side = <b>${N(round(lv))}</b>, right side = <b>${N(round(rv))}</b>`;
    if (Math.abs(lv - rv) < 1e-9) {
      setScale(0, true);
      lock();
      const first = R.tries === 1;
      markRight($("#check"), first ? 10 : 5);
      fb.className = "feedback show good";
      fb.innerHTML = `✓ Balanced! x = ${N(x)} makes both sides equal ${N(round(lv))}. ${first ? "First try! 🎯" : "Got it on the second try! 💪"}`;
      R.partResults.push(first ? true : "half");
      if (R.topic === "boss") bossHit();
      showSteps(steps);
      endSolve();
    } else {
      setScale(lv > rv ? -1 : 1, false, Math.abs(lv - rv));
      markWrong();
      if (R.tries === 1 && R.topic !== "boss") {
        fb.className = "feedback show bad";
        fb.innerHTML = `✗ The scale tipped! The ${lv > rv ? "left" : "right"} side is heavier, so ${lv > rv ? "try a smaller" : "try a bigger"} number${coefSignFlip(L, Rt) ? " (careful, the x side may work the other way!)" : ""}. One more try!`;
        input.select();
      } else {
        lock();
        fb.className = "feedback show bad";
        fb.innerHTML = `✗ Not this time. The answer is <b>x = ${N(x)}</b>. Here's how to get it:`;
        R.partResults.push(false);
        if (R.topic === "boss") bossMiss();
        setTimeout(() => setScale(0, true), 900);
        showSteps(steps);
        endSolve();
      }
    }
  };
  const lock = () => { input.disabled = true; $("#check").disabled = true; };
  $("#check").addEventListener("click", check);
  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  if (R.q.kind === "solve") setTimeout(() => input.focus(), 100);
}
function coefSignFlip(L, Rt) { return evalSide(L, 1) - evalSide(L, 0) < evalSide(Rt, 1) - evalSide(Rt, 0); }
function round(v) { return Math.round(v * 1000) / 1000; }
function parseNum(s) {
  const t = String(s).trim().replace(/−|–/g, "-").replace(/\s+/g, "");
  if (!/^-?\d+(\.\d+)?$/.test(t)) return null;
  return Number(t);
}
function endSolve() {
  const parts = R.partResults;
  let result;
  if (R.q.kind === "sentence" && R.topic !== "boss") {
    const score = (parts[0] ? 1 : 0) + (parts[1] === true ? 1 : parts[1] === "half" ? .5 : 0);
    result = score === 2 ? "good" : score >= 1 ? "half" : "bad";
  } else {
    result = parts[0] === true ? "good" : parts[0] === "half" ? "half" : "bad";
  }
  setTimeout(() => finishQuestion(result), 300);
}
function showSteps(steps) {
  const ol = $("#steps");
  ol.innerHTML = steps.map((s, i) => `<li class="${i === steps.length - 1 ? "final" : ""}" style="animation-delay:${i * .35 + .2}s">${fmt(s[0])}<small>${s[1]}</small></li>`).join("");
}

// SVG balance scale
function scaleSVG(L, Rt) {
  const txt = (s) => s.replace(/\//g, " ÷ ").replace(/x/g, '<tspan class="v">x</tspan>');
  const size = s => Math.max(10, Math.min(17, 190 / (s.length * .6)));
  const pan = (id, s) => `<g id="${id}">
      <line x1="0" y1="0" x2="-44" y2="62" stroke="#8f9bbd" stroke-width="2"/><line x1="0" y1="0" x2="44" y2="62" stroke="#8f9bbd" stroke-width="2"/>
      <path d="M-62 62 Q0 96 62 62 Z" fill="#2b3554" stroke="#55628c" stroke-width="2"/>
      <rect x="-80" y="34" width="160" height="26" rx="8" fill="#0f1426" stroke="#3a4670"/>
      <text class="pan-text" y="52" font-size="${size(s)}">${txt(s)}</text></g>`;
  return `<svg class="scale" id="scale" viewBox="0 0 440 250" aria-label="Balance scale">
      <defs><linearGradient id="st" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9aa6cc"/><stop offset="1" stop-color="#4c5679"/></linearGradient></defs>
      <path d="M220 112 L192 228 L248 228 Z" fill="url(#st)"/><rect x="168" y="226" width="104" height="12" rx="6" fill="#4c5679"/>
      ${pan("panL", L)}${pan("panR", Rt)}
      <g id="beamG"><rect class="beam" x="85" y="106" width="270" height="10" rx="5" fill="#ffb347"/></g>
      <circle cx="220" cy="111" r="8" fill="#ffd84d"/>
    </svg>`;
}
let scaleAngle = 0, scaleTarget = 0, scaleIdle = true, scaleRAF = null;
function startScale() {
  scaleAngle = 0; scaleTarget = 0; scaleIdle = true;
  cancelAnimationFrame(scaleRAF);
  const tick = t => {
    const svg = document.getElementById("scale");
    if (!svg) return;
    const goal = scaleIdle ? Math.sin(t / 500) * 3 : scaleTarget;
    scaleAngle += (goal - scaleAngle) * .12;
    const rad = scaleAngle * Math.PI / 180, arm = 135;
    $("#beamG").setAttribute("transform", `rotate(${scaleAngle} 220 111)`);
    $("#panL").setAttribute("transform", `translate(${220 - arm * Math.cos(rad)} ${111 - arm * Math.sin(rad)})`);
    $("#panR").setAttribute("transform", `translate(${220 + arm * Math.cos(rad)} ${111 + arm * Math.sin(rad)})`);
    scaleRAF = requestAnimationFrame(tick);
  };
  scaleRAF = requestAnimationFrame(tick);
}
function setScale(dir, balanced, diff = 0) {
  scaleIdle = false;
  scaleTarget = balanced ? 0 : dir * Math.min(16, 6 + Math.log2(1 + diff) * 2);
  $("#scale").classList.toggle("balanced", !!balanced);
}

/* ---------- quadratics ---------- */
function setupQuadInputs() {
  const q = R.q, i1 = $("#r1"), i2 = $("#r2");
  const check = () => {
    const a = parseNum(i1.value), b = parseNum(i2.value);
    if (a === null || b === null) { toast("Type both roots! 🙂"); (a === null ? i1 : i2).focus(); return; }
    R.tries++;
    const ok = (a === q.r1 && b === q.r2) || (a === q.r2 && b === q.r1);
    const fb = $("#fb2");
    const lock = () => { i1.disabled = i2.disabled = true; $("#check").disabled = true; };
    if (ok) {
      lock();
      const first = R.tries === 1;
      markRight($("#check"), first ? 12 : 6);
      fb.className = "feedback show good";
      fb.innerHTML = `✓ Correct! The roots are ${N(q.r1)} and ${N(q.r2)}. Look: the graph crosses the x-axis exactly there!`;
      R.partResults.push(first ? true : "half");
      if (R.topic === "boss") bossHit();
    } else {
      markWrong();
      const val = v => q.a * (v - q.r1) * (v - q.r2);
      const good = [a, b].filter(v => v === q.r1 || v === q.r2).length;
      if (R.tries === 1 && R.topic !== "boss") {
        fb.className = "feedback show bad";
        fb.innerHTML = `✗ ${good === 1 ? "One of them is right! Fix the other one." : `Not quite. Check: putting x = ${N(a)} gives ${N(val(a))}, not 0.`} One more try!`;
        return;
      }
      lock();
      fb.className = "feedback show bad";
      fb.innerHTML = `✗ The roots are <b>${N(q.r1)}</b> and <b>${N(q.r2)}</b>. Here's the trick:`;
      R.partResults.push(false);
      if (R.topic === "boss") bossMiss();
    }
    showSteps(q.steps);
    drawGraph(q);
    endSolve();
  };
  $("#check").addEventListener("click", check);
  [i1, i2].forEach(el => el.addEventListener("keydown", e => { if (e.key === "Enter") check(); }));
  setTimeout(() => i1.focus(), 100);
}

function drawGraph(q) {
  const f = x => q.a * (x - q.r1) * (x - q.r2);
  const lo = Math.min(q.r1, q.r2) - 2.5, hi = Math.max(q.r1, q.r2) + 2.5;
  const vx = (q.r1 + q.r2) / 2, vy = f(vx);
  const yTop = Math.max(f(lo), f(hi)), yBot = Math.min(vy, 0);
  const W = 460, H = 260, pad = 30;
  const X = x => pad + (x - lo) / (hi - lo) * (W - 2 * pad);
  const Y = y => H - pad - (y - yBot) / (yTop - yBot || 1) * (H - 2 * pad);
  let path = "";
  for (let i = 0; i <= 120; i++) { const x = lo + (hi - lo) * i / 120; path += `${i ? "L" : "M"}${X(x).toFixed(1)} ${Y(f(x)).toFixed(1)}`; }
  let grid = "";
  for (let x = Math.ceil(lo); x <= hi; x++) grid += `<line x1="${X(x)}" x2="${X(x)}" y1="${pad / 2}" y2="${H - pad / 2}" stroke="#1e2640"/>`;
  const axisY = Y(0), axisX = X(0);
  const yAxis = lo < 0 && hi > 0 ? `<line x1="${axisX}" x2="${axisX}" y1="${pad / 2}" y2="${H - pad / 2}" stroke="#55628c" stroke-width="2"/>` : "";
  const roots = [q.r1, q.r2].map((r, i) => `<circle class="root" cx="${X(r)}" cy="${axisY}" r="7" style="animation-delay:${i * .3}s"/><text x="${X(r)}" y="${axisY + (vy < 0 ? -14 : 22)}" text-anchor="middle">x = ${N(r)}</text>`).join("");
  $("#graph").innerHTML = `<svg class="graph" viewBox="0 0 ${W} ${H}">
    ${grid}
    <line x1="${pad / 2}" x2="${W - pad / 2}" y1="${axisY}" y2="${axisY}" stroke="#55628c" stroke-width="2"/>${yAxis}
    <text x="${W - pad / 2 - 4}" y="${axisY - 6}" text-anchor="end">x</text>
    <path class="curve" id="curve" d="${path}"/>
    ${roots}
    <text x="${pad / 2 + 4}" y="${pad / 2 + 10}">y = ${q.eq.replace(" = 0", "")}</text>
  </svg>`;
  const c = $("#curve"), len = c.getTotalLength();
  c.style.strokeDasharray = len; c.style.strokeDashoffset = len;
  c.getBoundingClientRect();
  c.style.transition = "stroke-dashoffset 1.6s ease-out";
  c.style.strokeDashoffset = 0;
}

/* ---------- side panels ---------- */
function renderSide() {
  const side = $("#side");
  if (R.topic === "sentence") side.innerHTML = `
    <h3>📘 Word → Symbol</h3>
    <div class="dict">
      <div class="x"><span>a number, its age, ₹x</span><b>x</b></div>
      <div class="a"><span>sum, more than, increased by, together</span><b>+</b></div>
      <div class="s"><span>less than, decreased by, subtracted, left</span><b>−</b></div>
      <div class="m"><span>times, twice, thrice, product</span><b>×</b></div>
      <div class="d"><span>half of, one-third of, divided by</span><b>÷</b></div>
      <div class="e"><span>is, gives, equals, the result is</span><b>=</b></div>
    </div>
    <div class="tip"><b>Watch out!</b> "5 less than x" means <b>x − 5</b>, not 5 − x. The number you start with comes first.</div>
    <div class="tip"><b>Step 1:</b> Let the unknown be x.<br><b>Step 2:</b> Change the words into symbols.<br><b>Step 3:</b> Put = where it says "is" or "gives".<br><b>Step 4:</b> Solve it!</div>`;
  if (R.topic === "solve") side.innerHTML = `
    <h3>⚖️ The Golden Rule</h3>
    <p>An equation is like a balance scale. <b>Whatever you do to one side, do to the other</b>, and it stays balanced.</p>
    <div class="tip"><b>Undo +</b> with −, <b>undo −</b> with +.<br><b>Undo ×</b> with ÷, <b>undo ÷</b> with ×.</div>
    <div class="tip"><b>Do it in reverse order:</b> deal with + and − first, then × and ÷.</div>
    <div class="tip"><b>Check:</b> put your answer back in. If the scale balances, you're right!</div>`;
  if (R.topic === "quad") side.innerHTML = `
    <h3>📈 Factorising Trick</h3>
    <p>For <b>x² + bx + c = 0</b>, find two numbers that <b>multiply to c</b> and <b>add to b</b>.</p>
    <div class="tip">Example: <span class="eqn">x² + 5x + 6 = 0</span><br>2 × 3 = 6 and 2 + 3 = 5<br><span class="eqn">(x + 2)(x + 3) = 0</span><br>So <b>x = −2</b> or <b>x = −3</b></div>
    <div class="tip"><b>Watch the signs!</b> (x + 2) = 0 gives x = −2.</div>
    <div class="tip"><b>Roots</b> are where the graph crosses the x-axis.</div>`;
  if (R.topic === "boss") side.innerHTML = `
    <h3>👾 The X-Beast</h3>
    <p>It feeds on wrong answers! Mixed questions from every topic.</p>
    <div class="tip">⚔️ <b>8 correct answers</b> defeat the boss.<br>❤️ You have <b>3 lives</b>.<br>🎯 Only <b>one try</b> per question!</div>
    <div class="tip">Tip: practise each topic first to get stronger.</div>`;
  if (R.topic !== "boss") side.innerHTML += `<div class="score-line"><span>Level</span><b>${["", "Easy", "Medium", "Hard"][R.level]}</b></div>`;
}

/* ---------- results ---------- */
function showResults() {
  const card = $("#qcard");
  let stars, title, msg;
  if (R.topic === "boss") {
    const won = R.hp <= 0;
    stars = won ? (R.lives === 3 ? 3 : R.lives === 2 ? 2 : 1) : 0;
    title = won ? "🏆 YOU DEFEATED THE X-BEAST!" : "💀 The X-Beast wins… this time";
    msg = won ? `You won with ${R.lives} ${R.lives === 1 ? "life" : "lives"} left!` : "Practise the topics and come back stronger!";
    if (won) { sfx.win(); burst(200); }
  } else {
    const score = R.results.reduce((t, r) => t + (r === "good" ? 1 : r === "half" ? .5 : 0), 0);
    const pct = score / R.total;
    stars = pct >= .85 ? 3 : pct >= .6 ? 2 : pct >= .35 ? 1 : 0;
    title = stars === 3 ? "🌟 AMAZING!" : stars === 2 ? "🎉 GREAT JOB!" : stars === 1 ? "👍 GOOD EFFORT!" : "💪 KEEP PRACTISING!";
    msg = `You scored ${score} out of ${R.total}.`;
    if (stars >= 2) { sfx.win(); burst(160); }
  }
  if (stars > (save.stars[R.topic] || 0)) save.stars[R.topic] = stars;
  store();
  const canHarder = R.topic !== "boss" && R.level < 3 && stars >= 2;
  card.innerHTML = `<div class="results">
      <div class="q-label">ROUND COMPLETE</div>
      <div class="big-stars">${[1, 2, 3].map(i => `<span class="${i <= stars ? "on" : ""}" style="animation-delay:${i * .25}s">★</span>`).join("")}</div>
      <h2>${title}</h2>
      <p class="sub">${msg}</p>
      <div class="res-grid">
        <div><b>${R.right}</b><span>PERFECT ANSWERS</span></div>
        <div><b>+${R.xp}</b><span>XP EARNED</span></div>
        <div><b>${save.bestStreak}</b><span>BEST STREAK</span></div>
      </div>
      <div class="res-btns">
        <button class="btn ghost" id="res-home">🏠 Topics</button>
        <button class="btn" id="res-again">🔁 Play again</button>
        ${canHarder ? `<button class="btn alt" id="res-harder">⬆ Try ${["", "", "Medium", "Hard"][R.level + 1]}</button>` : ""}
      </div></div>`;
  R.results.length = R.total;
  renderProgress();
  $("#res-home").addEventListener("click", () => { renderHome(); showScreen("home"); });
  $("#res-again").addEventListener("click", () => startTopic(R.topic, R.level));
  if (canHarder) $("#res-harder").addEventListener("click", () => startTopic(R.topic, R.level + 1));
}

/* =====================================================
   BOSS: THE X-BEAST (pixel art drawn with code)
   ===================================================== */
const BEAST = {
  normal: ["..H......", "..HH.....", "...HBBBBB", "..BBBBBBB", ".BBLLBBBB", ".BLWWPBBB", ".BBWPPBBB", ".BBBBBBBB", ".BBBMMMMM", ".BBBMTMTM", "BBBBBBBXB", "BBBBBBBBX", "BBBBBBBXB", "B.BBBBBBB", "..BBDDBBB", "..DD...DD"],
  hurt: ["..H......", "..HH.....", "...HBBBBB", "..BBBBBBB", ".BBLLBBBB", ".BLPBPBBB", ".BBBPBBBB", ".BBPBPBBB", ".BBBBBBBB", ".BBBBTMTM", "BBBBBBBXB", "BBBBBBBBX", "BBBBBBBXB", "B.BBBBBBB", "..BBDDBBB", "..DD...DD"],
  laugh: ["..H......", "..HH.....", "...HBBBBB", "..BBBBBBB", ".BBLLBBBB", ".BLBPBBBB", ".BBPBPBBB", ".BBBBBBBB", ".BBBTTTTT", ".BBBMMMMM", "BBBBMRRXB", "BBBBBBBBX", "BBBBBBBXB", "B.BBBBBBB", "..BBDDBBB", "..DD...DD"]
};
const BEAST_COLORS = { B: "#ff9f43", L: "#ffd29d", D: "#c96a12", H: "#fff3d6", W: "#ffffff", P: "#1a1033", M: "#3a1c08", T: "#ffffff", X: "#7c5cff", R: "#ff7aa8" };
function beastSVG(face) {
  const rows = BEAST[face].map(l => l + l.split("").reverse().join("").replace(/L/g, "B"));
  let rects = "";
  rows.forEach((row, y) => row.split("").forEach((ch, x) => { if (BEAST_COLORS[ch]) rects += `<rect x="${x}" y="${y}" width="1.03" height="1.03" fill="${BEAST_COLORS[ch]}"/>`; }));
  return `<svg viewBox="0 0 18 16" shape-rendering="crispEdges">${rects}</svg>`;
}
function bossArenaHTML() {
  return `<div class="arena" id="arena"><span class="sprite ${R.hp <= 40 ? "angry" : ""}" id="sprite">${beastSVG("normal")}</span>
    <div class="hp"><span>HP</span><div class="hp-bar"><div id="hpbar" style="width:${R.hp}%"></div></div><span class="lives" id="lives">${"❤️".repeat(R.lives)}${"🖤".repeat(3 - R.lives)}</span></div></div>`;
}
function bossAfterRender() { /* nothing extra needed yet */ }
let faceTimer;
function bossHit() {
  R.hp = Math.max(0, R.hp - 12.5);
  const s = $("#sprite");
  sfx.hit();
  s.innerHTML = beastSVG("hurt");
  replay(s, R.hp <= 0 ? "dead" : "hit", R.hp <= 0 ? 5000 : 650);
  popText("💥 HIT!", "#ffd84d", $("#arena"), true);
  $("#hpbar").style.width = `${R.hp}%`;
  clearTimeout(faceTimer);
  faceTimer = setTimeout(() => { if (R.hp > 0) { s.innerHTML = beastSVG("normal"); s.classList.toggle("angry", R.hp <= 40); } }, 800);
  if (R.hp <= 0) setTimeout(() => { burst(150); toast("🏆 The X-Beast is defeated!"); }, 600);
}
function bossMiss() {
  R.lives--;
  const s = $("#sprite");
  s.innerHTML = beastSVG("laugh");
  replay(s, "laugh", 1250);
  replay($("#arena"), "ouch", 700);
  $("#lives").textContent = "❤️".repeat(R.lives) + "🖤".repeat(3 - R.lives);
  replay($("#lives"), "lost", 500);
  ["HA!", "HA!", "HA!"].forEach((t, i) => setTimeout(() => popText(t, "#ffb347", $("#sprite"), false), i * 220));
  clearTimeout(faceTimer);
  faceTimer = setTimeout(() => { s.innerHTML = beastSVG("normal"); }, 1300);
}

/* ---------- buttons + start ---------- */
$("#go-home").addEventListener("click", () => { renderHome(); showScreen("home"); });
$("#back").addEventListener("click", () => { sfx.click(); renderHome(); showScreen("home"); });
$("#sound").addEventListener("click", () => { save.sound = !save.sound; store(); refreshStats(); sfx.click(); });
document.querySelectorAll("#diff button").forEach(b => b.addEventListener("click", () => { sfx.click(); startTopic(R.topic, Number(b.dataset.d)); }));

(function floatingSymbols() {
  const syms = ["x", "y", "π", "∑", "√", "÷", "=", "+", "x²", "∞", "≠", "%", "½", "∆"];
  const bg = $("#bg");
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("span");
    s.textContent = pick(syms);
    s.style.left = `${Math.random() * 100}%`;
    s.style.fontSize = `${20 + Math.random() * 40}px`;
    s.style.animationDuration = `${18 + Math.random() * 22}s`;
    s.style.animationDelay = `${-Math.random() * 30}s`;
    bg.appendChild(s);
  }
})();

renderHome();
</script>
